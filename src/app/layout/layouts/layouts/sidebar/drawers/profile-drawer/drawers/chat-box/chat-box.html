    </div>
  </div>

  <!-- Messages -->
  <div class="p-4 space-y-4 overflow-y-auto" style="height: calc(100vh - 180px);">

    <!-- Received -->
    <div class="flex items-start">
      <div class="w-8 h-8 rounded-full bg-gray-300 mr-3 mt-1 flex items-center justify-center text-sm font-semibold text-white">A</div>
      <div class="bg-white p-3 rounded-xl shadow-sm max-w-[75%]">
        <p class="text-sm text-gray-800">Hey there! How are you doing?</p>
        <p class="text-xs text-gray-400 text-right mt-1">10:30 AM</p>
      </div>
    </div>

    <!-- Sent -->
    <div class="flex justify-end">
      <div class="bg-green-100 p-3 rounded-xl shadow-sm max-w-[75%]">
        <p class="text-sm text-gray-800">I'm good, thanks! Just working on some projects.</p>
        <p class="text-xs text-gray-400 text-right mt-1">10:32 AM</p>
      </div>
    </div>

    <!-- Received -->
    <div class="flex items-start">
      <div class="w-8 h-8 rounded-full bg-gray-300 mr-3 mt-1 flex items-center justify-center text-sm font-semibold text-white">A</div>
      <div class="bg-white p-3 rounded-xl shadow-sm max-w-[75%]">
        <p class="text-sm text-gray-800">That sounds interesting! What kind of projects?</p>
        <p class="text-xs text-gray-400 text-right mt-1">10:33 AM</p>
      </div>
    </div>

    <!-- Sent with preview -->
    <div class="flex justify-end">
      <div class="bg-green-100 p-3 rounded-xl shadow-sm max-w-[75%]">
        <p class="text-sm text-gray-800">Building a chat application similar to WhatsApp. Here's a preview:</p>
        <div class="mt-2 bg-white p-3 rounded-md border border-gray-200">
          <p class="font-medium text-gray-700">ChatApp Design</p>
          <p class="text-xs text-gray-400">Just now</p>
        </div>
        <div class="flex justify-end items-center mt-1 space-x-1">
          <p class="text-xs text-gray-400">10:35 AM</p>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-blue-500" fill="none" viewBox="0 0 24 24"
               stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        </div>
      </div>
    </div>

  </div>

  <!-- Input area -->
  <div class="bg-white border-t p-3 fixed bottom-0 left-0 right-0 shadow-md">
    <div class="flex items-center space-x-2">
      <button class="p-2 text-gray-500 hover:bg-gray-100 rounded-full">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </button>
      <input type="text" placeholder="Type a message"
             class="flex-1 border border-gray-300 rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500 text-sm">
      <button class="p-2 bg-green-500 text-white rounded-full hover:bg-green-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
        </svg>
      </button>
    </div>
  </div>
