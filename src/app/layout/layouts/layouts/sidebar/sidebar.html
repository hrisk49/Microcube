<div class="flex h-screen">
  <div class="w-20 bg-white shadow-2xl flex flex-col items-center py-6 relative z-20 border-r border-gray-100">
    <!-- Logo -->
    <div class="mb-8 group relative h-16 w-16">
      <img class="cursor-pointer" routerLink="/dashboard" src="/asset/logos/leads.svg" alt=""/>
    </div>

    <!-- Navigation Items -->
    <div class="flex-1 flex flex-col space-y-3">
      <!--  Applications Menu -->
      <div class="group">
        <div (click)="toggleDrawer('Menu')"
             class="rounded-lg p-2 cursor-pointer hover:bg-gray-100 transition-all duration-200 relative flex items-center justify-center w-10 h-10">
          <img src="/asset/icons/menu.svg"/>

          <!-- Tooltip is now a child of the icon wrapper -->
          <div
            class="tooltip absolute left-full top-1/2 transform -translate-y-1/2 ml-2 px-2 py-1 bg-gray-900 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap pointer-events-none z-50">
            Menu
            <div
              class="absolute top-1/2 left-0 transform -translate-y-1/2 -translate-x-1 w-1.5 h-1.5 bg-gray-900 rotate-45">
            </div>
          </div>
        </div>
      </div>

      <!--  Applications Menu -->
      <div class="group">
        <div
          class="rounded-lg p-2 cursor-pointer hover:bg-gray-100 transition-all duration-200 relative flex items-center justify-center w-10 h-10">
          <img src="/asset/icons/apps.svg"/>

          <!-- Tooltip is now a child of the icon wrapper -->
          <div
            class="tooltip absolute left-full top-1/2 transform -translate-y-1/2 ml-2 px-2 py-1 bg-gray-900 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap pointer-events-none z-50">
            Switch Application
            <div
              class="absolute top-1/2 left-0 transform -translate-y-1/2 -translate-x-1 w-2 h-2 bg-gray-800 rotate-45">
            </div>
          </div>
        </div>
      </div>

      <!--  Dashboard Menu -->
      <div class="group">
        <div routerLink="/dashboard"
          class="rounded-lg p-2 cursor-pointer hover:bg-gray-100 transition-all duration-200 relative flex items-center justify-center w-10 h-10">
          <img src="/asset/icons/dashboard.svg"/>

          <!-- Tooltip is now a child of the icon wrapper -->
          <div
            class="tooltip absolute left-full top-1/2 transform -translate-y-1/2 ml-2 px-2 py-1 bg-gray-900 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap pointer-events-none z-50">
            Dashboard
            <div
              class="absolute top-1/2 left-0 transform -translate-y-1/2 -translate-x-1 w-2 h-2 bg-gray-800 rotate-45">
            </div>
          </div>
        </div>
      </div>

      <!--  Reports Menu -->
      <div class="group">
        <div
          class="rounded-lg p-2 cursor-pointer hover:bg-gray-100 transition-all duration-200 relative flex items-center justify-center w-10 h-10">
          <img src="/asset/icons/reports.svg"/>

          <!-- Tooltip is now a child of the icon wrapper -->
          <div
            class="tooltip absolute left-full top-1/2 transform -translate-y-1/2 ml-2 px-2 py-1 bg-gray-900 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap pointer-events-none z-50">
            Reports
            <div
              class="absolute top-1/2 left-0 transform -translate-y-1/2 -translate-x-1 w-2 h-2 bg-gray-800 rotate-45">
            </div>
          </div>
        </div>
      </div>

      <!--  Approval Menu -->
      <div class="group">
        <div
          class="rounded-lg p-2 cursor-pointer hover:bg-gray-100 transition-all duration-200 relative flex items-center justify-center w-10 h-10">
          <img src="/asset/icons/approval.svg"/>

          <!-- Tooltip is now a child of the icon wrapper -->
          <div
            class="tooltip absolute left-full top-1/2 transform -translate-y-1/2 ml-2 px-2 py-1 bg-gray-900 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap pointer-events-none z-50">
            Approval
            <div
              class="absolute top-1/2 left-0 transform -translate-y-1/2 -translate-x-1 w-2 h-2 bg-gray-800 rotate-45">
            </div>
          </div>
        </div>
      </div>

      <!--  Language Menu -->
      <div class="group">
        <div
          class="rounded-lg p-2 cursor-pointer hover:bg-gray-100 transition-all duration-200 relative flex items-center justify-center w-10 h-10">
          <img src="/asset/icons/language.svg"/>

          <!-- Tooltip is now a child of the icon wrapper -->
          <div
            class="tooltip absolute left-full top-1/2 transform -translate-y-1/2 ml-2 px-2 py-1 bg-gray-900 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap pointer-events-none z-50">
            Language
            <div
              class="absolute top-1/2 left-0 transform -translate-y-1/2 -translate-x-1 w-2 h-2 bg-gray-800 rotate-45">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Items -->
    <div class="flex flex-col space-y-3 mt-auto">

      <!--Notifications-->
<!--      <div class="group relative">-->
<!--        <div (click)="toggleDrawer('Profile')"-->
<!--             class="p-2 rounded-lg cursor-pointer hover:bg-gray-100 transition-all duration-200 flex items-center justify-center w-10 h-10">-->
<!--          <mat-icon class="text-gray-600 transition-colors">person</mat-icon>-->
<!--        </div>-->
<!--        <div-->
<!--          class="absolute left-full top-1/2 transform -translate-y-1/2 ml-2 px-2 py-1 bg-gray-900 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap pointer-events-none z-50">-->
<!--          Profile-->
<!--          <div-->
<!--            class="absolute top-1/2 left-0 transform -translate-y-1/2 -translate-x-1 w-1.5 h-1.5 bg-gray-900 rotate-45"></div>-->
<!--        </div>-->
<!--      </div>-->

      <!-- User Profile -->
      <div class="group relative">
        <div (click)="toggleDrawer('Profile')"
             class="p-2 rounded-lg cursor-pointer hover:bg-gray-100 transition-all duration-200 flex items-center justify-center w-10 h-10">
          <mat-icon class="text-gray-600 transition-colors">person</mat-icon>
        </div>
        <div
          class="absolute left-full top-1/2 transform -translate-y-1/2 ml-2 px-2 py-1 bg-gray-900 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap pointer-events-none z-50">
          Profile
          <div
            class="absolute top-1/2 left-0 transform -translate-y-1/2 -translate-x-1 w-1.5 h-1.5 bg-gray-900 rotate-45"></div>
        </div>
      </div>

      <!-- Logout -->
      <div class="group relative" routerLink="/login">
        <div
          class="p-2 rounded-lg cursor-pointer hover:bg-red-50 transition-all duration-200 flex items-center justify-center w-10 h-10">
          <mat-icon class="text-gray-600 hover:text-red-600 transition-colors">logout</mat-icon>
        </div>
        <div
          class="absolute left-full top-1/2 transform -translate-y-1/2 ml-2 px-2 py-1 bg-gray-900 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap pointer-events-none z-50">
          Logout
          <div
            class="absolute top-1/2 left-0 transform -translate-y-1/2 -translate-x-1 w-1.5 h-1.5 bg-gray-900 rotate-45"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div
  class="fixed z-10 top-[65px] h-full w-[400px] bg-white shadow-2xl border-r border-gray-200"
  [style.left]="drawerOpen ? '80px' : '-480px'"
  [style.transition]="'left 0.3s ease-in-out'"
  [style.opacity]="drawerOpen ? '1' : '0'"
  [style.visibility]="drawerOpen ? 'visible' : 'hidden'">

  <!-- Header with gradient -->
  <div
    class="flex justify-between items-center p-4 border-b border-gray-200">
    <h2 class="text-lg font-medium text-gray-800 flex items-center">
      <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
      </svg>
      {{ drawerType | titlecase }}
    </h2>
    <button
      (click)="drawerOpen = false"
      class="text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-full p-2 transition-all duration-200 ease-in-out transform hover:scale-110">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- Menu -->
  <div class="overflow-y-auto h-[calc(100vh-65px-65px)]">
    @if (drawerType === 'Profile') {
      <app-profile-drawer></app-profile-drawer>
    } @else if (drawerType === 'Menu') {
      <app-menu-drawer></app-menu-drawer>
    }
  </div>

  <!-- Resize handle -->
  <div
    class="absolute right-0 top-0 h-full w-1 bg-gray-200 hover:bg-blue-400 cursor-col-resize transition-colors duration-200"></div>
</div>
