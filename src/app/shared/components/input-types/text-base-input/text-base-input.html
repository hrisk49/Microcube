<div [formGroup]="frmGroup()" class="form-group w-full">
  <label class="block mb-1 font-medium text-gray-700">
    {{label()}}
    @if (isRequired()) {
      <span class="text-red-500">*</span>
    }
  </label>
  <input [formControlName]="controlName()" [ngClass]="{'readonly-input': isReadonly() }"
         [readonly]="isReadonly()" matInput placeholder="Enter {{label()}}" [type]="type() ?? 'text'" class="custom-input"/>
  @if (frmGroup().get(controlName())?.invalid && (frmGroup().get(controlName())?.touched || frmGroup().get(controlName())?.dirty)) {
    <div class="text-red-500 text-sm mt-1">
      {{label()}} is required..!
    </div>
  }
</div>
