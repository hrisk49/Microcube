<!-- [ngClass]="containerClasses()" -->
<div 
class="input-container"
	[style]="styles()"
	[matTooltip]="tooltip()"
>

    <label class="input-label relative" [attr.for]="id() || null">
      {{ labelText() }}
      @if (isRequired()) { <span class="text-red-500">*</span> }
    </label>

	<div class="file-input-group" 
		style="position: relative;"
		[class.drag-over]="isDragOver()"
		(dragover)="onDragOver($event)"
		(dragleave)="onDragLeave($event)"
		(drop)="onDrop($event)">
		<div class="file-display custom-input" [class.readonly-input]="disabled()" (click)="fileInput.click()">
			<span aria-hidden="true" style="display:inline-block;vertical-align:middle;margin-right:8px;">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M14 2H6C4.895 2 4 2.895 4 4V20C4 21.105 4.895 22 6 22H18C19.105 22 20 21.105 20 20V8L14 2Z" stroke="#64748b" stroke-width="1.5"/>
					<path d="M14 2V8H20" stroke="#64748b" stroke-width="1.5"/>
					<path d="M8 15H16" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
					<path d="M8 12H12" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
				</svg>
			</span>
			<span>{{ fileNamesDisplay() }}</span>
		</div>
		<input 
			class="file-native-input"
			[type]="'file'"
			[id]="id() || null"
			[disabled]="disabled()"
			[accept]="acceptAttr()"
			[attr.multiple]="multipleFile() ? '' : null"
			(change)="onFileInputChange($event)"
			style="opacity:0;position:absolute;left:0;top:0;width:100%;height:100%;cursor:pointer;"
			#fileInput
		/>
	</div>
</div>
