<div class="expansion-sub-header" (click)="togglePanel()">
  <div class="flex gap-2 items-center relative justify-between">
    <div class="flex gap-2 items-center">
      <div class="w-5 h-5 mr-3 -mt-[1px]">
        <!-- Modern panel icon using SVG -->
        <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" stroke-width="2"
             viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M13 16h-1v-4h-1m1-4h.01M12 20.5C6.753 20.5 2.5 16.247 2.5 11S6.753 1.5 12 1.5 21.5 5.753 21.5 11 17.247 20.5 12 20.5z" />
        </svg>
      </div>
      <h2>
        <span>{{subPanelTitle()}}</span>
      </h2>
    </div>

    <div class="flex items-center gap-2">
      <!-- Optional Action Button -->
      @if (isButton()) {
        <button 
          (click)="onActionClick($event)"
          class="inline-flex items-center px-2 py-1 text-xs font-medium text-gray-700 bg-gray-100 border border-gray-300 rounded hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-colors duration-200"
          type="button">
          <mat-icon class="text-sm mr-1 w-3 h-3">{{buttonIcon()}}</mat-icon>
          {{buttonText()}}
        </button>
      }
      
      <!-- Toggle Arrow Icon -->
      <mat-icon class="text-gray-500 transition-transform duration-200" 
                [class.rotate-180]="isOpenSignal()()">
        keyboard_arrow_down
      </mat-icon>
    </div>
  </div>
</div>
