<div class="page-wrapper">
    @if(frmGroup) {
     


    <form [formGroup]="frmGroup">
        <div class="panel">
 
    <div class="transaction-grid-container mb-10 ">
     <app-expansion-panel-header
        [isOpenSignal]="businessHeaderPanel"
        [panelTitle]="'All components'"
      />
    <div class="form-grid-col-1">

         <!-- Text Box -->
    <div class="component-section">
      <app-text-base-input
        [frmGroup]="frmGroup"
        [controlName]="'textBox'"
        [label]="'Text Box'"
        [isReadonly]="false"
        tooltip="Username must be between 3-20 characters"
        tooltipPosition="above"
        [tooltipDelay]="300"
        tooltipClass="success-tooltip"
        [customErrorMessages]="{ required: 'Text Box is required',
          minlength: 'Minimum 3 characters required', maxlength: 'Maximum 20 characters allowed' }"
      ></app-text-base-input>
    </div>





    <!-- ID Box -->
    <div class="component-section">
      <lds-id-box
        [frmGroup]="frmGroup"
        [controlName]="'id'"
        [label]="'ID Box'"
 
        [isDotsVisible]="true"
        [tooltip]="'Click to select ID'"
        [tooltipPosition]="'above'"
        [tooltipDelay]="300"
        (dotsClicked)="openFromBicSelectionModal()"

      ></lds-id-box>
    </div>

    <!-- Amount Input -->
    <div class="component-section">
      <lds-amount
        [frmGroup]="frmGroup"
        [controlName]="'amount'"
        [label]="'Amount Input'"
        [decimalPlaces]="3"
        [tooltip]="'Enter amount'"
        [allowLeadingZeros]="false"
        [maxLen]="10"
        
        ></lds-amount>
      </div>



    <!-- Amount to Word -->
    <div class="component-section">
      <app-amount-to-word-input
        [frmGroup]="frmGroup"
        [controlName]="'amountToWord'"
        [label]="'Amount in Word'"
        [currency]="'USD'"
        [decimalPlaces]="3"
   
        [maxLen]="10"
        [tooltip]="'Enter amount in words'"
        ></app-amount-to-word-input>
    </div>

    <!-- Dropdown -->
    <div class="component-section">
      <app-select-option-field
        [frmGroup]="frmGroup"
        [controlName]="'dropdown'"
        [label]="'Dropdown'"
        [options]="dropdownOptions"
        [tooltip]="'Select an option'"
        (onSelect)="handleCategorySelection($event)"
      ></app-select-option-field>
    </div>

    <!-- Multi-Select Dropdown -->
    <div class="component-section">
      <app-multi-select-option-field
        [frmGroup]="frmGroup"
        [controlName]="'multiSelect'"
        [label]="'Multi-Select Dropdown'"
        [options]="dropdownOptions"
      ></app-multi-select-option-field>
    </div>





    <!-- Multi-Select Dropdown -->
    <div class="component-section">
      <app-multi-select-option-field
        [frmGroup]="frmGroup"
        [controlName]="'multiSelect'"
        [label]="'Multi-Select Dropdown'"
        [options]="dropdownOptions"
      ></app-multi-select-option-field>
    </div>





    <!-- Date Input -->
    <div class="component-section">
      <lds-date-input
        [frmGroup]="frmGroup"
        [controlName]="'date'"
        [label]="'Date Input'"
      ></lds-date-input>
    </div>
 



    <!-- Number Input -->
    <!-- <div class="component-section">
      <app-text-base-input
        [frmGroup]="frmGroup"
        [controlName]="'number'"
        [label]="'Number Input'"
        [type]="'number'"
        [maxLength]="10"
      ></app-text-base-input>
    </div> -->

     <!-- Number Input
    <div class="component-section">
      <lds-number
        [frmGroup]="frmGroup"
        [controlName]="'number'"
        [label]="'Number Input 2'"
        [maxLen]="10"
      ></lds-number>
    </div>
     -->

    <lds-number 
  [frmGroup]="frmGroup"
  controlName="number"
  label="Number"
  [minValue]="1"
  [maxValue]="120"
  [maxLen]="3"
  placeholder="Enter your age">
</lds-number>

    <!-- Office Box -->
    <div class="component-section">
      <lds-office-box
        [frmGroup]="frmGroup"
        controlName="officeCode"
        labelText="Office Code"
        placeholder="Enter Office Code"
        [enable]="true"
        [visible]="true"
        [maxLen]="4"
      ></lds-office-box>
    </div>

    <!-- File Upload -->
  <lds-file
  #pdfFileInput
  [id]="'pdf-upload'"
  [multipleFile]="false"
  [fileExtension]="'.pdf'"
  [labelText]="'Upload PDF Document'"
  [cssClass]="'border-blue-300 bg-blue-50'"
  [savePath]="'documents/pdfs'"
  [customFileName]="'important-document'"
  (selectedFilesChanged)="onPdfSelected($event)"
  (onFileChanged)="onFileInputChanged('PDF')"
/>

        <!-- <lds-file
          [id]="'image-upload'"
          [multipleFile]="true"
          [fileExtension]="'.jpg,.jpeg,.png,.webp,.gif'"
          [labelText]="'Upload Images'"
          [cssClass]="'border-green-300 bg-green-50'"
          [savePath]="'images/gallery'"
          (selectedFilesChanged)="onImagesSelected($event)"
          (onFileChanged)="onFileInputChanged('Images')"
        />


         <lds-file
          [multipleFile]="true"
          [fileExtension]="'.pdf,.doc,.docx,.txt,.xls,.xlsx'"
          [labelText]="'Upload Documents'"
          [cssClass]="'border-purple-300 bg-purple-50 hover:border-purple-400'"
          [style]="''"
          [savePath]="'documents/uploads'"
          (selectedFilesChanged)="onDocumentsSelected($event)"
        />


        <lds-file
          [multipleFile]="true"
          [fileExtension]="'*/*'"
          [labelText]="'Upload Any Files'"
          [visible]="showAnyFileUpload"
          [cssClass]="'border-gray-400'"
          (selectedFilesChanged)="onAnyFilesSelected($event)"
        /> -->

    <!-- Switch -->
    <div class="component-section">
      <lds-switch
        [frmGroup]="frmGroup"
        [controlName]="'switch'"
        [labelText]="'Switch'"
      ></lds-switch>
    </div>




        <!-- Text Area -->
    <div class="component-section">
      <lds-txt-area
        [frmGroup]="frmGroup"
        [controlName]="'textArea'"
        [labelText]="'Text Area'"
        [rows]="1"
        [minRows]="2"
        [maxRows]="10"
        [maxCols]="80"
        [placeholder]="'Enter product description...'"
        [showRowCount]="true"
        [autoResize]="true"
      ></lds-txt-area>
    </div>

    <!-- Data Grid -->
    <div class="component-section">
        <lds-data-grid
          [id]="'pacs008-transactions'"
          [dataSource]="sampleTransactions()"
          [initPageSize]="5"
          [enableSelection]="true"
          [showEditButton]="true"
          [showDeleteButton]="true"
          [showViewButton]="true"
          [showPrintButton]="true"
          [useInlineEdit]="true"
          [editableColumns]="['amount', 'status', 'priority', 'department', 'category', 'assignedRole']"
          [numberColumns]="['amount']"
          [dropdownColumns]="transactionDropdownColumns()"
          [dropdownOptions]="transactionDropdownOptions()"
          [selectedColumns]="['id', 'transactionType', 'amount', 'status', 'priority']"
          [rowDesignerList]="transactionRowDesigners()"
          [tblClass]="'pacs008-table'"
          (onFHEditClick)="onTransactionEdit($event)"
          (onFHDeleteClick)="onTransactionDelete($event)"
          (onFHViewClick)="onTransactionView($event)"
          (onPrint)="onTransactionPrint($event)"
          (onChecked)="onTransactionRowSelect($event)"
          (onSelectAllChange)="onTransactionSelectAll($event)"
          (dataSourceChanged)="onTransactionDataChanged($event)"
        > 
        </lds-data-grid>
        
    </div>


    </div>
            </div>
        </div>
  
  </form>
<app-data-selection-modal
  *ngIf="isDataSelectionModalOpen()"
  (onFindClicked)="onFindClicked($event)"
  (onRowDoubleClick)="onDataSelectionResult($event)"
  (result)="onDataSelectionResult($event)"
>
</app-data-selection-modal>

    }
  
</div>
