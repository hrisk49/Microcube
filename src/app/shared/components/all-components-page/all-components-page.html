<div class="page-wrapper">
    @if(frmGroup) {
     


    <form [formGroup]="frmGroup">
        <div class="panel">
 
    <div class="transaction-grid-container mb-10 ">
     <app-expansion-panel-header
        [isOpenSignal]="businessHeaderPanel"
        [panelTitle]="'All components'"
      />
    <div class="form-grid-col-1">

         <!-- Text Box -->
    <div class="component-section">
      <app-text-base-input
        [frmGroup]="frmGroup"
        [controlName]="'textBox'"
        [label]="'Text Box'"
        [isReadonly]="false"
        [minLength]="3"
        [maxLength]="20"
        tooltip="Username must be between 3-20 characters"
        tooltipPosition="above"
        [tooltipDelay]="300"
        tooltipClass="success-tooltip"

        
         (onDoubleClick)="openFromBicSelectionModal()"
      ></app-text-base-input>
    </div>





    <!-- ID Box -->
    <div class="component-section">
      <lds-id-box
        [frmGroup]="frmGroup"
        [controlName]="'id'"
        [label]="'ID Box'"
        [minLength]="5"
        [maxLength]="10"
        [isDotsVisible]="true"
      ></lds-id-box>
    </div>

    <!-- Amount Input -->
    <div class="component-section">
      <lds-amount
        [frmGroup]="frmGroup"
        [controlName]="'amount'"
        [label]="'Amount Input'"
        [decimalPlaces]="3"
        [minAmt]="1"
        [maxLen]="10"
        [allowLeadingZeros]="false"  
        [maxAmt]="1000"
      ></lds-amount>
    </div>



    <!-- Amount to Word -->
    <div class="component-section">
      <app-amount-to-word-input
        [frmGroup]="frmGroup"
        [controlName]="'amountToWord'"
        [label]="'Amount in Word'"
        [decimalPlaces]="3"
        [minAmt]="1"
        [maxAmt]="1000"
        [maxLen]="10"
        
      ></app-amount-to-word-input>
    </div>

    <!-- Dropdown -->
    <div class="component-section">
      <app-select-option-field
        [frmGroup]="frmGroup"
        [controlName]="'dropdown'"
        [label]="'Dropdown'"
        [options]="dropdownOptions"
      ></app-select-option-field>
    </div>

    <!-- Date Input -->
    <div class="component-section">
      <lds-date-input
        [frmGroup]="frmGroup"
        [controlName]="'date'"
        [label]="'Date Input'"
        dateFormat="YYYY/MM/DD"
      ></lds-date-input>
    </div>
 

    <!-- Number Input -->
    <!-- <div class="component-section">
      <app-text-base-input
        [frmGroup]="frmGroup"
        [controlName]="'number'"
        [label]="'Number Input'"
        [type]="'number'"
        [maxLength]="10"
      ></app-text-base-input>
    </div> -->

     <!-- Number Input
    <div class="component-section">
      <lds-number
        [frmGroup]="frmGroup"
        [controlName]="'number'"
        [label]="'Number Input 2'"
        [maxLen]="10"
      ></lds-number>
    </div>
     -->

    <lds-number 
  [frmGroup]="frmGroup"
  controlName="number"
  label="Age"
  [minValue]="0"
  [maxValue]="120"
  [maxLen]="3"
  placeholder="Enter your age">
</lds-number>

    <!-- Office Box -->
    <div class="component-section">
      <lds-office-box
        [frmGroup]="frmGroup"
        controlName="officeCode"
        labelText="Office Code"
        placeholder="Enter Office Code"
        [enable]="true"
        [visible]="true"
      ></lds-office-box>
    </div>

    <!-- File Upload -->
  <lds-file
  #pdfFileInput
  [id]="'pdf-upload'"
  [multipleFile]="false"
  [fileExtension]="'.pdf'"
  [labelText]="'Upload PDF Document'"
  [cssClass]="'border-blue-300 bg-blue-50'"
  [savePath]="'documents/pdfs'"
  [customFileName]="'important-document'"
  (selectedFilesChanged)="onPdfSelected($event)"
  (onFileChanged)="onFileInputChanged('PDF')"
/>

          [id]="'image-upload'"

          [fileExtension]="'.jpg,.jpeg,.png,.webp,.gif'"
          [labelText]="'Upload Images'"
          [cssClass]="'border-green-300 bg-green-50'"
          [savePath]="'images/gallery'"
          (selectedFilesChanged)="onImagesSelected($event)"
          (onFileChanged)="onFileInputChanged('Images')"
        />

          [cssClass]="'border-purple-300 bg-purple-50 hover:border-purple-400'"

        <lds-file
          [multipleFile]="true"
          [fileExtension]="'*/*'"
          [labelText]="'Upload Any Files'"

          [cssClass]="'border-gray-400'"
          (selectedFilesChanged)="onAnyFilesSelected($event)"

    <!-- Switch -->
    <div class="component-section">
      <lds-switch
        [frmGroup]="frmGroup"
        [controlName]="'switch'"
        [labelText]="'Switch'"
      ></lds-switch>
    </div>




        <!-- Text Area -->
    <div class="component-section w-1/2">
      <lds-txt-area
        [frmGroup]="frmGroup"
        [controlName]="'textArea'"
        [labelText]="'Text Area'"
        [rows]="1"
        [minRows]="2"
        [maxRows]="10"
        [maxCols]="80"
        [maxLen]="500"
        [placeholder]="'Enter product description...'"
        [showRowCount]="true"
        [autoResize]="true"
      ></lds-txt-area>
    </div>

    <!-- Data Grid -->
    <div class="component-section">
        <lds-data-grid
          [id]="'pacs008-transactions'"
          [dataSource]="sampleTransactions()"
          [initPageSize]="5"
          [enableSelection]="true"
          [showEditButton]="true"
          [showDeleteButton]="true"
          [showViewButton]="true"
          [showPrintButton]="true"
          [useInlineEdit]="true"
          [editableColumns]="['amount', 'status', 'priority', 'department', 'category', 'assignedRole']"
          [numberColumns]="['amount']"
          [dropdownColumns]="transactionDropdownColumns()"
          [dropdownOptions]="transactionDropdownOptions()"
          [selectedColumns]="['id', 'transactionType', 'amount', 'status', 'priority']"
          [rowDesignerList]="transactionRowDesigners()"
          [tblClass]="'pacs008-table'"
          (onFHEditClick)="onTransactionEdit($event)"
          (onFHDeleteClick)="onTransactionDelete($event)"
          (onFHViewClick)="onTransactionView($event)"
          (onPrint)="onTransactionPrint($event)"
          (onChecked)="onTransactionRowSelect($event)"
          (onSelectAllChange)="onTransactionSelectAll($event)"
          (dataSourceChanged)="onTransactionDataChanged($event)"
        > 
        </lds-data-grid>
        
    </div>


        <!-- Stepper Component -->
<div class="component-section">
  <lds-stepper 
    [steps]="steps" 
    cssClass="my-custom-stepper"
    id="registrationStepper"
    (onSubmitCallback)="onStepperSubmit()">
  </lds-stepper>

  
 <ng-template #step1Template>
    <form id="personalInfoForm">
      <h3>Personal Information</h3>
      <div class="form-group">
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" required>
      </div>
      <div class="form-group">
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName" required>
      </div>
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </div>
    </form>
  </ng-template>

  <ng-template #step2Template>
    <form id="contactForm">
      <h3>Contact Details</h3>
      <div class="form-group">
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required>
      </div>
      <div class="form-group">
        <label for="address">Address:</label>
        <textarea id="address" name="address" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label for="city">City:</label>
        <input type="text" id="city" name="city" required>
      </div>
    </form>
  </ng-template>

  <ng-template #step3Template>
    <form id="reviewForm">
      <h3>Review Your Information</h3>
      <div class="review-section">
        <p><strong>Name:</strong> John Doe</p>
       <p><strong>Email:</strong> john&#64;example.com</p>
        <p><strong>Phone:</strong> (555) 123-4567</p>
        <p><strong>Address:</strong> 123 Main St, City</p>
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" required> I agree to the terms and conditions
        </label>
      </div>
    </form>
  </ng-template>


  

</div>
    </div>
            </div>
        </div>
  
  </form>

    }
  
</div>
