<div class="page-wrapper">
  <div class="bg-white rounded-lg shadow-2xl border border-gray-200 overflow-hidden mx-8">
    <!-- Search Header -->
    <div class="bg-slate-50 px-6 py-4 border-b border-gray-200">
      <div class="flex justify-between items-center">
        <h2 class="text-gray-900 font-medium text-lg">Data Table</h2>
        <div class="relative">
          <input
            type="text"
            id="filterInput"
            placeholder="Search..."
            class="px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-slate-500 focus:border-slate-500 outline-none text-sm w-64"
            onkeyup="applyFilter()"
          >
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="overflow-auto max-h-[75vh]">
      <table class="w-full">
        <thead class="bg-slate-100 border-b border-gray-200">
        <tr>
          <th class="text-center py-3 px-6 font-medium text-gray-700 text-sm">No.</th>
          <th class="text-center py-3 px-6 font-medium text-gray-700 text-sm">Name</th>
          <th class="text-center py-3 px-6 font-medium text-gray-700 text-sm">Weight</th>
          <th class="text-center py-3 px-6 font-medium text-gray-700 text-sm">Symbol</th>
          <th class="text-center py-3 px-6 font-medium text-gray-700 text-sm">Actions</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-gray-100" id="tableBody">
          @for (data of dataSource; track $index) {
            <tr class="hover:bg-slate-50">
              <td class="py-3 px-6 text-sm text-gray-700 text-center">{{$index + 1}}</td>
              <td class="py-3 px-6 text-gray-900 font-medium">{{data?.name}}</td>
              <td class="py-3 px-6 text-gray-700 text-center">{{data?.weight}}</td>
              <td class="py-3 px-6 text-gray-700">{{data?.symbol}}</td>
              <td class="py-3 px-6">
                <div class="flex gap-2 justify-center">
                  <button class="px-3 py-1 text-sm text-gray-600 hover:text-slate-800 hover:bg-slate-100 rounded">View</button>
                  <button class="px-3 py-1 text-sm text-gray-600 hover:text-slate-800 hover:bg-slate-100 rounded">Edit</button>
                  <button class="px-3 py-1 text-sm text-gray-600 hover:text-slate-800 hover:bg-slate-100 rounded">Delete</button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <!-- Pagination Footer -->
    <div class="bg-slate-50 px-6 py-4 border-t border-gray-200">
      <div class="flex justify-between items-center">
        <div class="text-sm text-gray-600">
          Showing 1 to 10 of 50 results
        </div>

        <div class="flex items-center gap-2">
          <select class="border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-slate-500 focus:border-slate-500 outline-none">
            <option value="5">5 per page</option>
            <option value="10" selected>10 per page</option>
            <option value="20">20 per page</option>
          </select>

          <nav class="flex gap-1 ml-4">
            <button class="px-3 py-2 text-sm text-gray-500 bg-white border border-gray-300 rounded-l hover:bg-slate-50">First</button>
            <button class="px-3 py-2 text-sm text-gray-500 bg-white border-t border-b border-gray-300 hover:bg-slate-50">Prev</button>
            <button class="px-3 py-2 text-sm bg-slate-600 text-white border border-slate-600">1</button>
            <button class="px-3 py-2 text-sm text-gray-500 bg-white border-t border-b border-gray-300 hover:bg-slate-50">2</button>
            <button class="px-3 py-2 text-sm text-gray-500 bg-white border-t border-b border-gray-300 hover:bg-slate-50">3</button>
            <button class="px-3 py-2 text-sm text-gray-500 bg-white border-t border-b border-gray-300 hover:bg-slate-50">Next</button>
            <button class="px-3 py-2 text-sm text-gray-500 bg-white border border-gray-300 rounded-r hover:bg-slate-50">Last</button>
          </nav>
        </div>
      </div>
    </div>
  </div>
</div>
