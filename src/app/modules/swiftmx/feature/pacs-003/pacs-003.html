<div class="page-wrapper">
  <form [formGroup]="frmGroup" class="form-wrapper">
    
    <!--Business Application Header V02-->
    <div class="panel">
      <app-panel-header [panelTitle]="'Business Application Header V02'" />
      <div class="form-grid-4-col">
        <app-text-base-input
          [frmGroup]="frmGroup"
          [label]="'Business Message Identifier'"
          [controlName]="'BizMsgIdr'"
        />

        <app-text-base-input
          [frmGroup]="frmGroup"
          [label]="'Message Definition Identifier'"
          [controlName]="'MsgDefIdr'"
        />

        <app-text-base-input
          [frmGroup]="frmGroup"
          [label]="'Business Service'"
          [controlName]="'BizSvc'"
        />

        <app-date-input
          [frmGroup]="frmGroup"
          [label]="'Creation Date'"
          [controlName]="'CreDt'"
        />

        <app-date-input
          [frmGroup]="frmGroup"
          [label]="'Requested Collection Date'"
          [controlName]="'ReqdColltnDt'"
        />

        <app-select-option-field
          [frmGroup]="frmGroup"
          [options]="duplicateOptions"
          [label]="'Copy Duplicate'"
          [controlName]="'cpyDplct'"
        />

        <app-select-option-field
          [frmGroup]="frmGroup"
          [options]="possibleDuplicateOptions"
          [label]="'Possible Duplicate'"
          [controlName]="'PsblDplct'"
        />

        <app-select-option-field
          [frmGroup]="frmGroup"
          [options]="priorityOptions"
          [label]="'Priority'"
          [controlName]="'Priority'"
        />
      </div>

      <!--Related Sub-Panel-->
      <div class="sub-panel">
        <app-sub-panel-header
          [subPanelTitle]="'Related'"
          [divElement]="related"
          [isOptional]="true"
        />
        <div #related class="form-grid-4-col">
          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Business Message Identifier'"
            [controlName]="'RltdBizMsgIdr'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Message Definition Identifier'"
            [controlName]="'RltdMsgDefIdr'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Business Service'"
            [controlName]="'RltdBizSvc'"
          />

          <app-date-input
            [frmGroup]="frmGroup"
            [label]="'Creation Date'"
            [controlName]="'RltdCreDt'"
          />

          <app-select-option-field
            [frmGroup]="frmGroup"
            [options]="duplicateOptions"
            [label]="'Copy Duplicate'"
            [controlName]="'RltdcpyDplct'"
          />

          <app-select-option-field
            [frmGroup]="frmGroup"
            [options]="possibleDuplicateOptions"
            [label]="'Possible Duplicate'"
            [controlName]="'RltdPsblDplct'"
          />

          <app-select-option-field
            [frmGroup]="frmGroup"
            [options]="priorityOptions"
            [label]="'Priority'"
            [controlName]="'RltdPriority'"
          />
        </div>
      </div>
    </div>

    <!--FI To FI Customer Direct Debit V08-->
    <div class="panel">
      <app-panel-header [panelTitle]="'FI To FI Customer Direct Debit V08'" />

      <!--Group Header-->
      <div class="sub-panel">
        <app-sub-panel-header 
          [subPanelTitle]="'Group Header'" 
          [divElement]="groupHeader"
          [isOptional]="true"
        />
        <div #groupHeader class="form-grid-4-col">
          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Message Identification'"
            [controlName]="'MsgId'"
          />

          <app-date-input
            [frmGroup]="frmGroup"
            [label]="'Creation Date Time'"
            [controlName]="'CreDtTm'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Number Of Transactions'"
            [controlName]="'NbOfTxs'"
          />
        </div>

        <!--Settlement Information-->
        <div class="sub-panel">
          <app-sub-panel-header 
            [subPanelTitle]="'Settlement Information'" 
            [divElement]="settlementInfo"
            [isOptional]="true"
          />
          <div #settlementInfo class="form-grid-4-col">
            <app-select-option-field 
              [frmGroup]="frmGroup"
              [options]="settlementMethodOptions"
              [label]="'Settlement Method'"
              [controlName]="'SttlmMtd'"/>

            <app-text-base-input 
              [frmGroup]="frmGroup"
              [label]="'Account Id'"
              [controlName]="'SttlmAcctId'"/>

            <app-text-base-input 
              [frmGroup]="frmGroup"
              [label]="'IBAN'"
              [controlName]="'SttlmAcctIban'"/>

            <app-text-base-input 
              [frmGroup]="frmGroup"
              [label]="'Account Name'"
              [controlName]="'SttlmAcctNm'"/>
          </div>
        </div>

        <!-- Settlement Account Details -->
        <app-account
          [frmGroup]="frmGroup"
          [prefix]="'SttlmAcct'"
          [title]="'Settlement Account Details'"
        />
      </div>

      <!-- Payment Identification -->
      <div class="sub-panel">
        <app-sub-panel-header 
          [subPanelTitle]="'Payment Identification'" 
          [divElement]="paymentIdentification"
          [isOptional]="true"
        />
        <div #paymentIdentification class="form-grid-4-col">
          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Instruction Identification'"
            [controlName]="'InstrId'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'End To End Identification'"
            [controlName]="'EndToEndId'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Transaction Identification'"
            [controlName]="'TxId'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'UETR'"
            [controlName]="'UETR'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Clearing System Reference'"
            [controlName]="'ClrSysRef'"
          />
        </div>
      </div>

      <!-- Payment Type Information -->
      <div class="sub-panel">
        <app-sub-panel-header 
          [subPanelTitle]="'Payment Type Information'" 
          [divElement]="paymentTypeInfo"
          [isOptional]="true"
        />
        <div #paymentTypeInfo class="form-grid-4-col">
          <app-select-option-field
            [frmGroup]="frmGroup"
            [options]="priorityOptions"
            [label]="'Instruction Priority'"
            [controlName]="'InstrPrty'"
          />

          <app-select-option-field
            [frmGroup]="frmGroup"
            [options]="clearingChannelOptions"
            [label]="'Clearing Channel'"
            [controlName]="'ClrChanl'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Service Level Code'"
            [controlName]="'SvcLvlCD'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Service Level Proprietary'"
            [controlName]="'SvcLvlPrtry'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Local Instrument Code'"
            [controlName]="'LclInstrmCD'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Local Instrument Proprietary'"
            [controlName]="'LclInstrmPrtry'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Category Purpose Code'"
            [controlName]="'CtgyPurpCd'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Category Purpose Proprietary'"
            [controlName]="'CtgyPurpPrtry'"
          />
        </div>
      </div>

      <!-- Settlement Information -->
      <div class="sub-panel">
        <app-sub-panel-header 
          [subPanelTitle]="'Settlement Information'" 
          [divElement]="settlementInfo2"
          [isOptional]="true"
        />
        <div #settlementInfo2 class="form-grid-4-col">
          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Settlement Currency'"
            [controlName]="'IntrBkSttlmAmtCcy'"
          />

          <app-amount-to-word-input
            [frmGroup]="frmGroup"
            [label]="'Interbank Settlement Amount'"
            [controlName]="'IntrBkSttlmAmt'"
          />

          <app-date-input
            [frmGroup]="frmGroup"
            [label]="'Interbank Settlement Date'"
            [controlName]="'IntrBkSttlmDt'"
          />

          <app-select-option-field
            [frmGroup]="frmGroup"
            [options]="settlementPriorityOptions"
            [label]="'Settlement Priority'"
            [controlName]="'SttlmPrty'"
          />
        </div>
      </div>

      <!-- Previous Instructing Agent 1 -->
      <app-agent
        [frmGroup]="frmGroup"
        [prefix]="'PrvsInstgAgt1'"
        [title]="'Previous Instructing Agent 1'"
        [isOptional]="true"
      />

      <!-- Previous Instructing Agent 2 -->
      <app-agent
        [frmGroup]="frmGroup"
        [prefix]="'PrvsInstgAgt2'"
        [title]="'Previous Instructing Agent 2'"
        [isOptional]="true"
      />

      <!-- Previous Instructing Agent 3 -->
      <app-agent
        [frmGroup]="frmGroup"
        [prefix]="'PrvsInstgAgt3'"
        [title]="'Previous Instructing Agent 3'"
        [isOptional]="true"
      />

      <!-- Instructing Agent -->
      <app-agent
        [frmGroup]="frmGroup"
        [prefix]="'InstgAgt'"
        [title]="'Instructing Agent'"
      />

      <!-- Instructed Agent -->
      <app-agent
        [frmGroup]="frmGroup"
        [prefix]="'InstdAgt'"
        [title]="'Instructed Agent'"
      />

      <!-- Intermediary Agent 1 -->
      <app-agent
        [frmGroup]="frmGroup"
        [prefix]="'IntrmyAgt1'"
        [title]="'Intermediary Agent 1'"
        [isOptional]="true"
      />

      <!-- Intermediary Agent 2 -->
      <app-agent
        [frmGroup]="frmGroup"
        [prefix]="'IntrmyAgt2'"
        [title]="'Intermediary Agent 2'"
        [isOptional]="true"
      />

      <!-- Intermediary Agent 3 -->
      <app-agent
        [frmGroup]="frmGroup"
        [prefix]="'IntrmyAgt3'"
        [title]="'Intermediary Agent 3'"
        [isOptional]="true"
      />

      <!-- Debtor -->
      <div class="sub-panel">
        <app-sub-panel-header 
          [subPanelTitle]="'Debtor'" 
          [divElement]="debtor"
          [isOptional]="true"
        />
        <div #debtor class="form-grid-4-col">
          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Debtor Name'"
            [controlName]="'DbtrNm'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Debtor Country of Residence'"
            [controlName]="'DbtrCtryOfRes'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Debtor Account ID'"
            [controlName]="'DbtrAcctId'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Debtor Account IBAN'"
            [controlName]="'DbtrAcctIban'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Debtor Account Currency'"
            [controlName]="'DbtrAcctCcy'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Debtor Account Name'"
            [controlName]="'DbtrAcctNm'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Debtor Agent BICFI'"
            [controlName]="'DbtrAgtBIcfi'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Debtor Agent Name'"
            [controlName]="'DbtrAgtNm'"
          />
        </div>
      </div>

      <!-- Creditor -->
      <div class="sub-panel">
        <app-sub-panel-header 
          [subPanelTitle]="'Creditor'" 
          [divElement]="creditor"
          [isOptional]="true"
        />
        <div #creditor class="form-grid-4-col">
          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Creditor Name'"
            [controlName]="'CdtrNm'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Creditor Country of Residence'"
            [controlName]="'CdtrCtryOfRes'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Creditor Account ID'"
            [controlName]="'CdtrAcctId'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Creditor Account IBAN'"
            [controlName]="'CdtrAcctIban'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Creditor Account Currency'"
            [controlName]="'CdtrAcctCcy'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Creditor Account Name'"
            [controlName]="'CdtrAcctNm'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Creditor Agent BICFI'"
            [controlName]="'CdtrAgtBIcfi'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Creditor Agent Name'"
            [controlName]="'CdtrAgtNm'"
          />
        </div>
      </div>

      <!-- Instructions -->
      <div class="sub-panel">
        <app-sub-panel-header 
          [subPanelTitle]="'Instructions'" 
          [divElement]="instructions"
          [isOptional]="true"
        />
        <div #instructions class="form-grid-4-col">
          <app-select-option-field
            [frmGroup]="frmGroup"
            [options]="instructionForCreditorAgentOptions"
            [label]="'Creditor Agent Code'"
            [controlName]="'InstrForCdtrAgtCD'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Creditor Agent Info'"
            [controlName]="'InstrForCdtrAgtInf'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Next Agent 1'"
            [controlName]="'InstrForNxtAgt1'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Next Agent 2'"
            [controlName]="'InstrForNxtAgt2'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Next Agent 3'"
            [controlName]="'InstrForNxtAgt3'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Next Agent 4'"
            [controlName]="'InstrForNxtAgt4'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Next Agent 5'"
            [controlName]="'InstrForNxtAgt5'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Next Agent 6'"
            [controlName]="'InstrForNxtAgt6'"
          />
        </div>
      </div>

      <!-- Purpose and Remittance -->
      <div class="sub-panel">
        <app-sub-panel-header 
          [subPanelTitle]="'Purpose and Remittance'" 
          [divElement]="purposeRemittance"
          [isOptional]="true"
        />
        <div #purposeRemittance class="form-grid-4-col">
          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Purpose Code'"
            [controlName]="'PurpCD'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Purpose Proprietary'"
            [controlName]="'PurpPrtry'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Remittance Information'"
            [controlName]="'RmtInf'"
          />
        </div>
      </div>

      <!-- Charges -->
      <div class="sub-panel">
        <app-sub-panel-header 
          [subPanelTitle]="'Charges'" 
          [divElement]="charges"
          [isOptional]="true"
        />
        <div #charges class="form-grid-4-col">
          <app-select-option-field
            [frmGroup]="frmGroup"
            [options]="chargeBearerOptions"
            [label]="'Charge Bearer'"
            [controlName]="'ChrgBr'"
          />

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Charge Currency'"
            [controlName]="'ChgCcy'"
          />

          <app-amount-to-word-input
            [frmGroup]="frmGroup"
            [label]="'Charge Amount'"
            [controlName]="'ChgAmt'"
          />
        </div>
      </div>

    </div>

  </form>
</div>
