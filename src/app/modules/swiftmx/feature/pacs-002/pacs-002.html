<div class="page-wrapper">
    <form [formGroup]="frmGroup" class="form-wrapper">

        <!--Business Application Header-->
        <div class="panel">
            <app-panel-header [panelTitle]="'Business Application Header'"/>
            <div class="form-grid-3-col">

                <app-amount-to-word-input [frmGroup]="frmGroup"
                                          [label]="'Amount to Text'"
                                          [controlName]="'amountToText'"/>

                <app-text-base-input [frmGroup]="frmGroup"
                                     [label]="'From BIC'"
                                     [controlName]="'fromBic'"/>

                <app-text-base-input [frmGroup]="frmGroup"
                                     [label]="'To BIC'"
                                     [controlName]="'toBic'"/>

                <app-text-base-input [frmGroup]="frmGroup"
                                     [isReadonly]="true"
                                     [label]="'Business Message Identifier'"
                                     [controlName]="'businessMessageIdentifier'"/>

                <app-text-base-input [frmGroup]="frmGroup"
                                     [label]="'Message Definition Identifier'"
                                     [controlName]="'messageDefinitionIdentifier'"/>

                <app-text-base-input [frmGroup]="frmGroup"
                                     [label]="'Business Service'"
                                     [controlName]="'businessService'"/>

                <app-select-option-field [frmGroup]="frmGroup"
                                         [options]="duplicateOptions"
                                         [label]="'Copy Duplicate'"
                                         [controlName]="'copyDuplicate'"/>

                <app-select-option-field [frmGroup]="frmGroup"
                                         [options]="priorityOptions"
                                         [label]="'Priority'"
                                         [controlName]="'priority'"/>

            </div>

            <div class="sub-panel">
                <app-sub-panel-header [subPanelTitle]="'Related'"/>
                <div class="form-grid-3-col">

                    <app-text-base-input [frmGroup]="frmGroup"
                                         [label]="'From BIC'"
                                         [controlName]="'relatedFromBic'"/>

                    <app-text-base-input [frmGroup]="frmGroup"
                                         [label]="'To BIC'"
                                         [controlName]="'relatedToBic'"/>

                    <app-text-base-input [frmGroup]="frmGroup"
                                         [label]="'Business Message Identifier'"
                                         [controlName]="'relatedBusinessMessageIdentifier'"/>

                    <app-text-base-input [frmGroup]="frmGroup"
                                         [label]="'Message Definition Identifier'"
                                         [controlName]="'relatedMessageDefinitionIdentifier'"/>

                    <app-text-base-input [frmGroup]="frmGroup"
                                         [label]="'Business Service'"
                                         [controlName]="'relatedBusinessService'"/>

                    <app-select-option-field [frmGroup]="frmGroup"
                                             [options]="duplicateOptions"
                                             [label]="'Copy Duplicate'"
                                             [controlName]="'relatedCopyDuplicate'"/>

                    <app-select-option-field [frmGroup]="frmGroup"
                                             [options]="priorityOptions"
                                             [label]="'Priority'"
                                             [controlName]="'relatedPriority'"/>

                </div>

            </div>
        </div>

        <div class="panel">
            <app-panel-header [panelTitle]="'FI To FI Payment Status'"/>
            <div class="form-grid-4-col">

                <app-text-base-input [frmGroup]="frmGroup"
                                     [label]="'Message Identification'"
                                     [controlName]="'msgId'"/>

                <app-date-input [frmGroup]="frmGroup"
                                [label]="'Creation Date'"
                                [controlName]="'creationDate'"/>


            </div>

            <div class="sub-panel">
                <app-sub-panel-header [subPanelTitle]="'Transaction Information And Status'"/>
                <div class="form-grid-4-col">

                    <app-text-base-input [frmGroup]="frmGroup"
                                         [label]="'Transaction Information And Status'"
                                         [controlName]="'TxInfAndSts'"/>

                    <app-text-base-input [frmGroup]="frmGroup"
                                         [label]="' Original Group Information'"
                                         [controlName]="'OrgnlGrpInf'"/>

                    <app-text-base-input [frmGroup]="frmGroup"
                                         [label]="' Original Message Identification'"
                                         [controlName]="'OrgnlMsgId'"/>
                    <app-text-base-input [frmGroup]="frmGroup"
                                         [label]="'Original Message Name Identification'"
                                         [controlName]="'OrgnlMsgNmId'"/>

                    <app-date-input [frmGroup]="frmGroup"
                                    [label]="'Creation Date Time'"
                                    [controlName]="'orgnlCreDtTm'"/>


                    <app-text-base-input [frmGroup]="frmGroup"
                                         [label]="' Original Instruction Identification'"
                                         [controlName]="'OrgnlInstrId'"/>
                    <app-text-base-input [frmGroup]="frmGroup"
                                         [label]="' Original End To End Identification'"
                                         [controlName]="'OrgnlEndToEndId'"/>
                    <app-text-base-input [frmGroup]="frmGroup"
                                         [label]="' Original Transaction Identification'"
                                         [controlName]="'OrgnlTxId'"/>
                    <app-text-base-input [frmGroup]="frmGroup"
                                         [label]="' Original UTER'"
                                         [controlName]="'OrgnlUETR'"/>
                    <app-text-base-input [frmGroup]="frmGroup"
                                         [label]="' Transaction Status'"
                                         [controlName]="'TxSts'"/>
                    <app-text-base-input [frmGroup]="frmGroup"
                                         [label]="' Clearing System Reference'"
                                         [controlName]="'ClrSysRef'"/>
                    <app-text-base-input [frmGroup]="frmGroup"
                                         [label]="' Instructing Agent'"
                                         [controlName]="'InstgAgt'"/>
                    <app-text-base-input [frmGroup]="frmGroup"
                                         [label]="' Instructed Agent'"
                                         [controlName]="'InstdAgt'"/>
                </div>

                <div class="sub-panel">
                    <app-sub-panel-header [subPanelTitle]=" 'Status Reason Information' "></app-sub-panel-header>

                    <div class="form-grid-4-col">
                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Department'"
                                             [controlName]="'dept'"/>

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Sub Department'"
                                             [controlName]="'subDept'"/>

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Street Name'"
                                             [controlName]="'strtNm'"/>

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Building Number'"
                                             [controlName]="'BldgNb'"/>

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Floor'"
                                             [controlName]="'flr'"/>
                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Post Box'"
                                             [controlName]="'pstBx'"/>
                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Room'"
                                             [controlName]="'room'"/>
                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Town Name'"
                                             [controlName]="'twnNm'"/>
                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Post Code'"
                                             [controlName]="'pstCd'"/>
                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Town Location Name'"
                                             [controlName]="'twnLctnNm'"/>

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'District Name'"
                                             [controlName]="'dstrctNm'"/>

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Country Sub Division'"
                                             [controlName]="'ctrySubDvsn'"/>

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Country'"
                                             [controlName]="'ctry'"/>

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Address Line'"
                                             [controlName]="'adrLine'"/>


                        <!--            <app-text-base-input [frmGroup]="frmGroup"-->
                        <!--                                 [label]="'Reason'"-->
                        <!--                                 [controlName]="'Rsn'"/>-->

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Additional Information 1'"
                                             [controlName]="'addtlInf1'"/>

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Additional Information 2'"
                                             [controlName]="'addtlInf2'"/>

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Reason Code'"
                                             [controlName]="'rsnCd'"/>

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Reson propietary'"
                                             [controlName]="'rsnPrtry'"/>
                    </div>

                    <!--            Either Orga nor private -->
                    <div class="sub-panel">
                        <app-sub-panel-header [subPanelTitle]="'Organization identification'"></app-sub-panel-header>
                        <div class="form-grid-4-col">
                            <app-text-base-input [frmGroup]="frmGroup"
                                                 [label]="'Organization Identification BIC'"
                                                 [controlName]="'orgIdBic'"/>

                            <app-text-base-input [frmGroup]="frmGroup"
                                                 [label]="'Organization Identification LEI'"
                                                 [controlName]="'orgIdLei'"/>

                            <app-text-base-input [frmGroup]="frmGroup"
                                                 [label]="'Organization Other Identification'"
                                                 [controlName]="'orgIdOthrId'"/>

                            <app-text-base-input [frmGroup]="frmGroup"
                                                 [label]="'Identification Other Issuer'"
                                                 [controlName]="'orgIdOthrIssr'"/>

                            <app-text-base-input [frmGroup]="frmGroup"
                                                 [label]="'Organization Other Code'"
                                                 [controlName]="'orgIdOthrCd'"/>
                            <app-text-base-input [frmGroup]="frmGroup"
                                                 [label]="'Organization Other Propietary'"
                                                 [controlName]="'orgIdOthrIssrPtry'"/>
                        </div>
                        <div class="sub-panel">
                            <app-sub-panel-header [subPanelTitle]="'Private identification'"></app-sub-panel-header>
                            <div class="form-grid-4-col">
                                <app-date-input [frmGroup]="frmGroup"
                                                [label]="'Birth Date'"
                                                [controlName]="'birthDt'"/>

                                <app-text-base-input [frmGroup]="frmGroup"
                                                     [label]="'Place of Birth'"
                                                     [controlName]="'prvcOfBirth'"/>

                                <app-text-base-input [frmGroup]="frmGroup"
                                                     [label]="'Private Other Identification'"
                                                     [controlName]="'prvtOthId1'"/>

                                <app-text-base-input [frmGroup]="frmGroup"
                                                     [label]="'City of Birth'"
                                                     [controlName]="'cityOfBirth'"/>

                                <app-text-base-input [frmGroup]="frmGroup"
                                                     [label]="'Country of Birth'"
                                                     [controlName]="'ctryOfBirth'"/>

                                <app-text-base-input [frmGroup]="frmGroup"
                                                     [label]="'Private Other Identification 1'"
                                                     [controlName]="'prvtOthId1'"/>
                                <app-date-input [frmGroup]="frmGroup"
                                                [label]="'Private Other Identification 2'"
                                                [controlName]="'prvtOthId2'"/>

                                <app-text-base-input [frmGroup]="frmGroup"
                                                     [label]="'Private Identification Scheme Name Code1'"
                                                     [controlName]="'prvtOthIdSchNmCd1'"/>
                                <app-text-base-input [frmGroup]="frmGroup"
                                                     [label]="'Private Identification Scheme Name Code2'"
                                                     [controlName]="'prvtOthIdSchNmCd2'"/>
                                <app-text-base-input [frmGroup]="frmGroup"
                                                     [label]="'Private Other Identification Issuer'"
                                                     [controlName]="'prvtOthIdIssr1'"/>
                                <app-text-base-input [frmGroup]="frmGroup"
                                                     [label]="'Private Other Identification Issuer2'"
                                                     [controlName]="'prvtOthIdIssr2'"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="sub-panel">
                    <app-sub-panel-header [subPanelTitle]="'Instructing Agent'"></app-sub-panel-header>
                    <div class="form-grid-4-col">
                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Instructing Agent BIC'"
                                             [controlName]="'bIcfi'"/>
                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Clearing System Identification Code'"
                                             [controlName]="'clrSysIdCd'"/>

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Member Identification'"
                                             [controlName]="'mmbId'"/>

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Instructing Agent LEI'"
                                             [controlName]="'lei'"/>
                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'name of the Agent'"
                                             [controlName]="'nm'"/>

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Adress Line 1'"
                                             [controlName]="'adrLine1'"/>

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Adress Line 2'"
                                             [controlName]="'adrLine2'"/>
                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Adress Line 3'"
                                             [controlName]="'adrLine3'"/>
                    </div>
                </div>

                <div class="sub-panel">
                    <app-sub-panel-header [subPanelTitle]="'Instructed Agent'"></app-sub-panel-header>
                    <div class="form-grid-4-col">
                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Instructed Agent BIC'"
                                             [controlName]="'bIcfi'"/>
                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Clearing System Identification Code'"
                                             [controlName]="'clrSysIdCd'"/>

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Member Identification'"
                                             [controlName]="'mmbId'"/>

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Instructed Agent LEI'"
                                             [controlName]="'lei'"/>
                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'name of the Agent'"
                                             [controlName]="'nm'"/>

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Adress Line 1'"
                                             [controlName]="'adrLine1'"/>

                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Adress Line 2'"
                                             [controlName]="'adrLine2'"/>
                        <app-text-base-input [frmGroup]="frmGroup"
                                             [label]="'Adress Line 3'"
                                             [controlName]="'adrLine3'"/>
                    </div>
                </div>

            </div>
        </div>
    </form>
</div>
