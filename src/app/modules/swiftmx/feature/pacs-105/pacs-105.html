<div class="page-wrapper">
  <form [formGroup]="frmGroup" class="form-wrapper">

    <!--Business Application Header-->
    <div class="panel">
      <app-panel-header [panelTitle]="'Business Application Header'"/>
      <div class="form-grid-4-col">

        <app-amount-to-word-input [frmGroup]="frmGroup"
                                  [label]="'Amount to Text'"
                                  [controlName]="'amountToText'"/>

        <app-text-base-input [frmGroup]="frmGroup"
                             [label]="'From BIC'"
                             [controlName]="'fromBic'"/>

        <app-text-base-input [frmGroup]="frmGroup"
                             [label]="'To BIC'"
                             [controlName]="'toBic'"/>

        <app-text-base-input [frmGroup]="frmGroup"
                             [isReadonly]="true"
                             [label]="'Business Message Identifier'"
                             [controlName]="'businessMessageIdentifier'"/>

        <app-text-base-input [frmGroup]="frmGroup"
                             [label]="'Message Definition Identifier'"
                             [controlName]="'messageDefinitionIdentifier'"/>

        <app-text-base-input [frmGroup]="frmGroup"
                             [label]="'Business Service'"
                             [controlName]="'businessService'"/>

        <app-select-option-field [frmGroup]="frmGroup"
                                 [options]="duplicateOptions"
                                 [label]="'Copy Duplicate'"
                                 [controlName]="'copyDuplicate'"/>

        <app-select-option-field [frmGroup]="frmGroup"
                                 [options]="priorityOptions"
                                 [label]="'Priority'"
                                 [controlName]="'priority'"/>

      </div>

      <div class="sub-panel">
        <app-sub-panel-header [subPanelTitle]="'Related'"
                              [divElement]="related"
                              [isOptional]="true"/>
        <div #related class="form-grid-4-col">
          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'From BIC'"
                               [controlName]="'relatedFromBic'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'To BIC'"
                               [controlName]="'relatedToBic'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Business Message Identifier'"
                               [controlName]="'relatedBusinessMessageIdentifier'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Message Definition Identifier'"
                               [controlName]="'relatedMessageDefinitionIdentifier'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Business Service'"
                               [controlName]="'relatedBusinessService'"/>

          <app-select-option-field [frmGroup]="frmGroup"
                                   [options]="duplicateOptions"
                                   [label]="'Copy Duplicate'"
                                   [controlName]="'relatedCopyDuplicate'"/>

          <app-select-option-field [frmGroup]="frmGroup"
                                   [options]="priorityOptions"
                                   [label]="'Priority'"
                                   [controlName]="'relatedPriority'"/>
        </div>
      </div>
    </div>

    <!--    Charges payment Notification-->

    <div class="panel">
      <app-panel-header [panelTitle]="'Charges payment Notification'"></app-panel-header>
      <fieldset class="custom-fieldset">
        <legend>Group Header</legend>
        <div class="form-grid-4-col">
          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Message Identification'"
                               [controlName]="'msgId'"/>

          <app-date-input [frmGroup]="frmGroup"
                          [label]="'Creation Date'"
                          [controlName]="'creDtTm'"/>
        </div>
        <!--        ChargesRequestor /FinancialInstitutionIdentification -->
      </fieldset>
      <fieldset class="custom-fieldset">
        <legend>Financial Institution Identification</legend>
        <div class="form-grid-4-col">
          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'BIC'"
            [controlName]="'bicfi'"/>
          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'legal Entity Identifier'"
            [controlName]="'lei'"/>

          <app-text-base-input
            [frmGroup]="frmGroup"
            [label]="'Name'"
            [controlName]="'nm'"/>

        </div>
      </fieldset>

      <fieldset class="custom-fieldset">
        <legend>Postal Address</legend>
        <div class="form-grid-4-col">
          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Department'"
                               [controlName]="'dept'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Sub Department'"
                               [controlName]="'subDept'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Street Name'"
                               [controlName]="'strtNm'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Building Number'"
                               [controlName]="'bldgNb'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Floor'"
                               [controlName]="'flr'"/>
          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Post Box'"
                               [controlName]="'pstBx'"/>
          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Room'"
                               [controlName]="'room'"/>
          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Town Name'"
                               [controlName]="'twnNm'"/>
          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Post Code'"
                               [controlName]="'pstCd'"/>
          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Town Location Name'"
                               [controlName]="'twnLctnNm'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'District Name'"
                               [controlName]="'dstrctNm'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Country Sub Division'"
                               [controlName]="'ctrySubDvsn'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Country'"
                               [controlName]="'ctry'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Address Line'"
                               [controlName]="'adrLine1'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Other Issuer'"
                               [controlName]="'finOthrIssr'"/>
        </div>
      </fieldset>

      <fieldset class="custom-fieldset">
        <legend> Other Scheme Name</legend>
        <div class="form-grid-4-col">
          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Other Scheme Code'"
                               [controlName]="'othrSchmCd'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Other Scheme propietary'"
                               [controlName]="'othrSchmPrtry'"/>
        </div>
      </fieldset>

      <fieldset class="custom-fieldset">
        <legend>Total Charges</legend>
        <div class="form-grid-4-col">
          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Charge Amount'"
                               [controlName]="'nbOfChrgsRcrds'"
          />

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Control Sum'"
                               [controlName]="'ctrlSum'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Total Charges Amount'"
                               [controlName]="'ttlChrgsAmt'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Creditor debtor Indicator'"
                               [controlName]="'cdtDbtInd'"/>
        </div>
      </fieldset>

      <fieldset class="custom-fieldset">
        <legend> Charges Account</legend>
        <div class="form-grid-4-col">
          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'IBAN'"
                               [controlName]="'iban'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Cahrges Account Type Code'"
                               [controlName]="'crgsAccTypeCd'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Charges Account Type Proprietary'"
                               [controlName]="'crgsAccTypePrtry'"/>

          <app-select-option-field
                              [frmGroup]="frmGroup"
                              [options]="currencyOptions"
                              [label]="'Currency'"
                              [controlName]="'ccy'"/>
        </div>
      </fieldset>

      <fieldset class="custom-fieldset">
        <legend> Charges Per-Transaction</legend>

        <div class="form-grid-4-col">
          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Charges Id'"
                               [controlName]="'ChrgsId'"/>
          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Record Identification'"
                               [controlName]="'rcrdId'"/>
          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="' Message Name Id'"
                               [controlName]="'msgNmId'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Account Servicer Reference'"
                               [controlName]="'acctSvcrRef'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Payment Information Id'"
                               [controlName]="'pmtInfId'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Instruction Id'"
                               [controlName]="'instrId'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                                [label]="'Mandate Id'"
                                [controlName]="'mndtId'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Cheque Number'"
                               [controlName]="'chqNb'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                                [label]="'Account Owner Transaction Id'"
                                [controlName]="'acctOwnrTxId'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Account Servicer Transaction Id'"
                               [controlName]="'acctSvcrTxId'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Transaction Id'"
                               [controlName]="'txnId'"/>
          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Number of Charges Records'"
                               [controlName]="'nbOfChrgsBrkdwnItms'"/>

          <app-date-input [frmGroup]="frmGroup"
                          [label]="' Record Value Date'"
                          [controlName]="'valDt'"/>
        </div>
      </fieldset>

    </div>
  </form>
</div>
