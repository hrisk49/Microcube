<div class="page-wrapper">
  <form [formGroup]="frmGroup" class="form-wrapper">

    <!--Business Application Header-->
    <div class="panel">
      <app-panel-header [panelTitle]="'Business Application Header'"/>
      <div class="form-grid-3-col">

        <app-amount-to-word-input [frmGroup]="frmGroup"
                                  [label]="'Amount to Text'"
                                  [controlName]="'amountToText'"/>

        <app-text-base-input [frmGroup]="frmGroup"
                             [label]="'From BIC'"
                             [controlName]="'fromBic'"/>

        <app-text-base-input [frmGroup]="frmGroup"
                             [label]="'To BIC'"
                             [controlName]="'toBic'"/>

        <app-text-base-input [frmGroup]="frmGroup"
                             [isReadonly]="true"
                             [label]="'Business Message Identifier'"
                             [controlName]="'businessMessageIdentifier'"/>

        <app-text-base-input [frmGroup]="frmGroup"
                             [label]="'Message Definition Identifier'"
                             [controlName]="'messageDefinitionIdentifier'"/>

        <app-text-base-input [frmGroup]="frmGroup"
                             [label]="'Business Service'"
                             [controlName]="'businessService'"/>

        <app-select-option-field [frmGroup]="frmGroup"
                                 [options]="duplicateOptions"
                                 [label]="'Copy Duplicate'"
                                 [controlName]="'copyDuplicate'"/>

        <app-select-option-field [frmGroup]="frmGroup"
                                 [options]="priorityOptions"
                                 [label]="'Priority'"
                                 [controlName]="'priority'"/>

      </div>

      <div class="sub-panel">
        <app-sub-panel-header [subPanelTitle]="'Related'"
                              [divElement]="related"
                              [isOptional]="true"/>
        <div #related class="form-grid-3-col">
          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'From BIC'"
                               [controlName]="'relatedFromBic'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'To BIC'"
                               [controlName]="'relatedToBic'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Business Message Identifier'"
                               [controlName]="'relatedBusinessMessageIdentifier'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Message Definition Identifier'"
                               [controlName]="'relatedMessageDefinitionIdentifier'"/>

          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'Business Service'"
                               [controlName]="'relatedBusinessService'"/>

          <app-select-option-field [frmGroup]="frmGroup"
                                   [options]="duplicateOptions"
                                   [label]="'Copy Duplicate'"
                                   [controlName]="'relatedCopyDuplicate'"/>

          <app-select-option-field [frmGroup]="frmGroup"
                                   [options]="priorityOptions"
                                   [label]="'Priority'"
                                   [controlName]="'relatedPriority'"/>
        </div>
      </div>
    </div>
  </form>
</div>
