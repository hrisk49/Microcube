<div class="page-wrapper">
  <form [formGroup]="frmGroup" class="form-wrapper">

    <!--Business Application Header-->
    <div class="panel">
      <app-panel-header [panelTitle]="'Business Application Header'"/>
      <div class="form-grid-4-col">

        <app-amount-to-word-input [frmGroup]="frmGroup"
                                  [label]="'Business Message Identifier'"
                                  [controlName]="'bizMsgIdr'"/>

        <app-text-base-input [frmGroup]="frmGroup"
                             [label]="'msgDefIdr'"
                             [controlName]="'msgDefIdr'"/>

        <app-text-base-input [frmGroup]="frmGroup"
                             [label]="'bizSvc'"
                             [controlName]="'bizSvc'"/>

        <app-text-base-input [frmGroup]="frmGroup"
                             [isReadonly]="true"
                             [label]="'creDt'"
                             [controlName]="'creDt'"/>

        <app-text-base-input [frmGroup]="frmGroup"
                             [label]="'cpyDplct'"
                             [controlName]="'cpyDplct'"/>

        <app-text-base-input [frmGroup]="frmGroup"
                             [label]="'psblDplct'"
                             [controlName]="'psblDplct'"/>

        <app-select-option-field [frmGroup]="frmGroup"
                                 [options]="duplicateOptions"
                                 [label]="'priority'"
                                 [controlName]="'priority'"/>

        <app-select-option-field [frmGroup]="frmGroup"
                                 [options]="priorityOptions"
                                 [label]="'msgId'"
                                 [controlName]="'msgId'"/>

      </div>
    </div>

    <!--FI To FI Customer Credit Transfer-->
    <div class="panel">
      <app-panel-header [panelTitle]="'FI To FI Customer Credit Transfer'"/>

      <!--Group Header-->
      <div class="sub-panel">
        <app-sub-panel-header [subPanelTitle]="'Group Header'"/>
        <div class="form-grid-4-col">
          <app-text-base-input [frmGroup]="frmGroup"
                               [label]="'creDtTm'"
                               [controlName]="'creDtTm'"/>

          <app-date-input [frmGroup]="frmGroup"
                          [label]="'nbOfTxs'"
                          [controlName]="'nbOfTxs'"/>
        </div>

        <!--Settlement Information-->
        <div class="sub-panel">
          <app-sub-panel-header [subPanelTitle]="'Settlement Information'"/>
          <div class="form-grid-4-col">
            <app-select-option-field [frmGroup]="frmGroup"
                                     [options]="settlementOptions"
                                     [label]="'sttlmMtd'"
                                     [controlName]="'sttlmMtd'"/>

            <app-text-base-input [frmGroup]="frmGroup"
                                 [label]="'sttlmAcct'"
                                 [controlName]="'sttlmAcct'"/>

            <app-text-base-input [frmGroup]="frmGroup"
                                 [label]="'instrId'"
                                 [controlName]="'instrId'"/>

            <app-text-base-input [frmGroup]="frmGroup"
                                 [label]="'endToEndId'"
                                 [controlName]="'endToEndId'"/>

            <app-text-base-input [frmGroup]="frmGroup"
                                 [label]="'txId'"
                                 [controlName]="'txId'"/>

            <app-text-base-input [frmGroup]="frmGroup"
                                 [label]="'uETR'"
                                 [controlName]="'uETR'"/>

            <app-text-base-input [frmGroup]="frmGroup"
                                 [label]="'clrSysRef'"
                                 [controlName]="'clrSysRef'"/>

            <app-text-base-input [frmGroup]="frmGroup"
                                 [label]="'instrPrty'"
                                 [controlName]="'instrPrty'"/>

            <app-text-base-input [frmGroup]="frmGroup"
                                 [label]="'clrChanl'"
                                 [controlName]="'clrChanl'"/>

            <app-text-base-input [frmGroup]="frmGroup"
                                 [label]="'SvcLvlCDn'"
                                 [controlName]="'SvcLvlCDn'"/>

            <app-text-base-input [frmGroup]="frmGroup"
                                 [label]="'SvcLvlPrtryw'"
                                 [controlName]="'SvcLvlPrtryw'"/>

            <app-text-base-input [frmGroup]="frmGroup"
                                 [label]="'lclInstrmCD'"
                                 [controlName]="'lclInstrmCD'"/>

            <app-text-base-input [frmGroup]="frmGroup"
                                 [label]="'lclInstrmPrtry'"
                                 [controlName]="'lclInstrmPrtry'"/>

            <app-text-base-input [frmGroup]="frmGroup"
                                 [label]="'ctgyPurpCd'"
                                 [controlName]="'ctgyPurpCd'"/>

            <app-text-base-input [frmGroup]="frmGroup"
                                 [label]="'ctgyPurpPrtry'"
                                 [controlName]="'ctgyPurpPrtry'"/>

            <app-text-base-input [frmGroup]="frmGroup"
                                 [label]="'intrBkSttlmAmtCcy'"
                                 [controlName]="'intrBkSttlmAmtCcy'"/>

          </div>
        </div>
      </div>
    </div>

      <div class="form-grid-4-col">
        <app-text-base-input [frmGroup]="frmGroup"
                             [label]="'intrBkSttlmAmt'"
                             [controlName]="'intrBkSttlmAmt'"/>

        <app-date-input [frmGroup]="frmGroup"
                        [label]="'intrBkSttlmDt'"
                        [controlName]="'intrBkSttlmDt'"/>

        <app-select-option-field [frmGroup]="frmGroup"
                                 [options]="duplicateOptions"
                                 [label]="'Settlement Priority'"
                                 [controlName]="'sttlmPrty'"/>

        <app-text-base-input [frmGroup]="frmGroup"
                             [label]="'Settlement Time Indication'"
                             [controlName]="'prvsInstgAgt1'"/>

        <app-text-base-input [frmGroup]="frmGroup"

                             [controlName]="'prvsInstgAgt1Acct'"/>

                             [controlName]="'prvsInstgAgt3'"/>

                                 [options]="chargeBearerOptions"
                                 [label]="'Charge Bearer'"
                                 [controlName]="'prvsInstgAgt2'"/>

        <app-select-option-field [frmGroup]="frmGroup"
                                 [options]="priorityOptions"
                                 [label]="'Exchange Rate'"
                                 [controlName]="'prvsInstgAgt2Acct'"/>
      </div>

      <div class="sub-panel">
        <app-sub-panel-header [subPanelTitle]="'Payment Identification'"/>

        <app-sub-panel-header [subPanelTitle]="'Payment Type Information'"/>

          <app-select-option-field [frmGroup]="frmGroup"

                                   [label]="'Instruction Priority'"
                                   [controlName]="'intrmyAgt1Acct'"/>

        <div class="sub-panel mt-3">
          <app-sub-panel-header [subPanelTitle]="'Service Level'"
                                [isButton]="true"
                                (addAction)="addServiceRow()"/>
        </div>
      </div>

      <!--Normal-->

        <app-text-base-input [frmGroup]="frmGroup"

          <app-text-base-input [frmGroup]="frmGroup"

          <app-text-base-input [frmGroup]="frmGroup"

                               [controlName]="'iBAN'"/>

          <app-text-base-input [frmGroup]="frmGroup"

                               [controlName]="'id'"/>

          <app-text-base-input [frmGroup]="frmGroup"
