<div [formGroup]="frmGroup" class="form-group w-full">
  <label for="name" class="block mb-1 font-medium text-gray-700">
    Full Name <span class="text-red-500">*</span>
  </label>
  <input [formControlName]="controlName" matInput placeholder="Enter your full name" type="text" class="custom-input"/>
  @if (frmGroup.get(controlName)?.invalid && (frmGroup.get(controlName)?.touched || frmGroup.get(controlName)?.dirty)) {
    <div class="text-red-500 text-xs mt-1">
      Name is required..!
    </div>
  }
</div>
