<div class="w-full mx-auto">
  <div class="bg-white rounded-xl shadow-lg p-8">
    <form class="space-y-8">

      <!-- Customer Basic Information -->
      <div class="border-b border-gray-200 pb-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-6">Customer Basic Information</h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text"
                   class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   placeholder="Enter full name">
          </div>

          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email"
                   class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   placeholder="example@email.com">
          </div>

          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="tel"
                   class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   placeholder="+880 1XXX-XXXXXX">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="form-group">
            <label class="form-label">Date of Birth</label>
            <input type="date"
                   class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>

          <div class="form-group">
            <label class="form-label">National ID</label>
            <input type="number"
                   class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   placeholder="Enter NID number">
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password"
                   class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   placeholder="Enter password">
          </div>
        </div>
      </div>

      <!-- Account Information -->
      <div class="border-b border-gray-200 pb-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-6">Account Information</h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="form-group">
            <label class="form-label">Account Type</label>
            <select
              class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="">Select account type</option>
              <option value="savings">Savings Account</option>
              <option value="current">Current Account</option>
              <option value="fixed">Fixed Deposit</option>
              <option value="recurring">Recurring Deposit</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Initial Deposit Amount</label>
            <input type="number" step="0.01"
                   class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   placeholder="0.00">
          </div>

          <div class="form-group">
            <label class="form-label">Branch</label>
            <select
              class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="">Select branch</option>
              <option value="dhanmondi">Dhanmondi Branch</option>
              <option value="gulshan">Gulshan Branch</option>
              <option value="banani">Banani Branch</option>
              <option value="uttara">Uttara Branch</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="form-group">
            <label class="form-label">Monthly Income Range</label>
            <input type="range" min="10000" max="500000" step="5000"
                   class="form-input w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer slider"
                   onchange="updateRangeValue(this.value)">
            <div class="flex justify-between text-sm text-gray-600 mt-1">
              <span>10K</span>
              <span id="rangeValue" class="font-medium text-blue-600">250K</span>
              <span>500K</span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Account Opening Time</label>
            <input type="time"
                   class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>

          <div class="form-group">
            <label class="form-label">Account Opening Date & Time</label>
            <input type="datetime-local"
                   class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>
        </div>
      </div>

      <!-- Address Information -->
      <div class="border-b border-gray-200 pb-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-6">Address Information</h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="form-group">
            <label class="form-label">Street Address</label>
            <input type="text"
                   class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   placeholder="House/Road/Street">
          </div>

          <div class="form-group">
            <label class="form-label">City</label>
            <input type="text"
                   class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   placeholder="City name">
          </div>

          <div class="form-group">
            <label class="form-label">Postal Code</label>
            <input type="text"
                   class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   placeholder="Post code">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="form-group">
            <label class="form-label">Website (if any)</label>
            <input type="url"
                   class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   placeholder="https://example.com">
          </div>

          <div class="form-group">
            <label class="form-label">Search Location</label>
            <input type="search"
                   class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   placeholder="Search your area">
          </div>

          <div class="form-group">
            <label class="form-label">Color Code (for identification)</label>
            <input type="color"
                   class="form-input w-full h-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent cursor-pointer">
          </div>
        </div>
      </div>

      <!-- Additional Information -->
      <div class="border-b border-gray-200 pb-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-6">Additional Information</h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="form-group">
            <label class="form-label">Upload Profile Picture</label>
            <input type="file" accept="image/*"
                   class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
          </div>

          <div class="form-group">
            <label class="form-label">Upload Documents</label>
            <input type="file" multiple accept=".pdf,.doc,.docx,.jpg,.png"
                   class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
          </div>

          <div class="form-group">
            <label class="form-label">Preferred Language</label>
            <select multiple
                    class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent h-24">
              <option value="bengali">Bengali</option>
              <option value="english">English</option>
              <option value="hindi">Hindi</option>
              <option value="urdu">Urdu</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Preferences -->
      <div class="border-b border-gray-200 pb-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-6">Preferences & Settings</h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <!-- Gender Radio Buttons -->
          <div class="form-group">
            <label class="form-label">Gender</label>
            <div class="space-y-2">
              <div class="flex items-center radio-group">
                <input type="radio" id="male" name="gender" value="male"
                       class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                <label for="male">Male</label>
              </div>
              <div class="flex items-center radio-group">
                <input type="radio" id="female" name="gender" value="female"
                       class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                <label for="female">Female</label>
              </div>
              <div class="flex items-center radio-group">
                <input type="radio" id="other" name="gender" value="other"
                       class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                <label for="other">Other</label>
              </div>
            </div>
          </div>

          <!-- Marital Status -->
          <div class="form-group">
            <label class="form-label">Marital Status</label>
            <div class="space-y-2">
              <div class="flex items-center radio-group">
                <input type="radio" id="single" name="marital" value="single"
                       class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                <label for="single">Single</label>
              </div>
              <div class="flex items-center radio-group">
                <input type="radio" id="married" name="marital" value="married"
                       class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                <label for="married">Married</label>
              </div>
              <div class="flex items-center radio-group">
                <input type="radio" id="divorced" name="marital" value="divorced"
                       class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                <label for="divorced">Divorced</label>
              </div>
            </div>
          </div>

          <!-- Services Checkboxes -->
          <div class="form-group">
            <label class="form-label">Required Services</label>
            <div class="space-y-2">
              <div class="flex items-center checkbox-group">
                <input type="checkbox" id="debit_card"
                       class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <label for="debit_card">Debit Card</label>
              </div>
              <div class="flex items-center checkbox-group">
                <input type="checkbox" id="credit_card"
                       class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <label for="credit_card">Credit Card</label>
              </div>
              <div class="flex items-center checkbox-group">
                <input type="checkbox" id="mobile_banking"
                       class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <label for="mobile_banking">Mobile Banking</label>
              </div>
              <div class="flex items-center checkbox-group">
                <input type="checkbox" id="internet_banking"
                       class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <label for="internet_banking">Internet Banking</label>
              </div>
              <div class="flex items-center checkbox-group">
                <input type="checkbox" id="sms_banking"
                       class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <label for="sms_banking">SMS Banking</label>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Text Areas -->
      <div class="border-b border-gray-200 pb-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-6">Additional Details</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="form-group">
            <label class="form-label">Address Details</label>
            <textarea rows="4"
                      class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                      placeholder="Enter detailed address including landmarks..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Special Instructions</label>
            <textarea rows="4"
                      class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                      placeholder="Any special instructions or requirements..."></textarea>
          </div>
        </div>
      </div>

      <!-- Hidden Field (for demo) -->
      <input type="hidden" name="form_id" value="banking_form_2024">

      <!-- Submit Button -->
      <div class="text-center pt-6">
        <button type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-8 rounded-lg transition-colors duration-200 shadow-md hover:shadow-lg">
          Submit Application
        </button>
      </div>
    </form>
  </div>
</div>
